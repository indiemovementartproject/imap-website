<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>iMAP Annual Jam · Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#5ce1e6; --pink:#f26fb2; --ink:#eaf6ff;
    --ok:#37e0b0; --bad:#ff6b7a; --warn:#ffcf6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); overflow:hidden; position:relative;
    background:
      radial-gradient(1200px 800px at 50% -10%, #12203a 0%, transparent 60%),
      radial-gradient(900px 700px at 90% 110%, #171233 0%, transparent 55%),
      linear-gradient(160deg,#070b16 0%,#0b1122 55%,#080d1a 100%);
  }
  /* floating background orbs */
  .orbs{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .orb{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.55;
        animation:float 14s ease-in-out infinite; }
  .orb::after{ content:""; position:absolute; top:14%; left:18%; width:34%; height:34%;
        border-radius:50%; background:rgba(255,255,255,.55); filter:blur(4px); }
  .c{ background:radial-gradient(circle at 34% 30%, rgba(92,225,230,.85), rgba(92,225,230,.06) 62%, transparent 70%);
      box-shadow:0 0 60px 8px rgba(92,225,230,.35); }
  .p{ background:radial-gradient(circle at 34% 30%, rgba(242,111,178,.8), rgba(242,111,178,.05) 62%, transparent 70%);
      box-shadow:0 0 60px 8px rgba(242,111,178,.3); }
  .w{ background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.7), rgba(255,255,255,.04) 60%, transparent 70%);
      box-shadow:0 0 50px 6px rgba(255,255,255,.15); }
  .o1{ width:140px; height:140px; top:8%;  left:-40px; }
  .o2{ width:90px;  height:90px;  top:22%; right:-24px; animation-delay:-3s; }
  .o3{ width:70px;  height:70px;  top:60%; left:8%;  animation-delay:-6s; }
  .o4{ width:120px; height:120px; bottom:6%; right:6%; animation-delay:-2s; }
  .o5{ width:52px;  height:52px;  top:46%; right:18%; animation-delay:-8s; }
  .o6{ width:46px;  height:46px;  bottom:20%; left:24%; animation-delay:-5s; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-22px) } }

  .app{ position:relative; z-index:1; max-width:460px; margin:0 auto;
        min-height:100dvh; display:flex; flex-direction:column; align-items:center;
        padding:26px 18px 34px; gap:16px; }

  .logo{ width:132px; height:132px; object-fit:contain; margin-top:4px;
         filter:drop-shadow(0 0 26px rgba(92,225,230,.55)) drop-shadow(0 6px 18px rgba(0,0,0,.5));
         animation:bob 6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }

  .glass{ background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14);
          backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
          box-shadow:0 8px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); }

  .counter{ display:flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px;
            font-size:15px; font-weight:600; letter-spacing:.3px; }
  .counter b{ color:var(--brand); font-size:17px; }

  .scanner{ width:100%; border-radius:22px; padding:14px; }
  #reader{ width:100%; border-radius:14px; overflow:hidden; }
  #reader video{ border-radius:14px; }
  .scanhint{ text-align:center; font-size:13px; opacity:.6; margin-top:2px; }

  .manual{ width:100%; border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .manual input{ width:100%; padding:13px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.18);
                 background:rgba(255,255,255,.06); color:#fff; font-size:15px;
                 font-family:ui-monospace,monospace; text-transform:uppercase; }
  .manual input::placeholder{ color:rgba(234,246,255,.4); text-transform:none; }
  .manual button{ width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
                  font-family:"Fredoka",sans-serif; font-weight:600; font-size:15px; color:#062225;
                  background:linear-gradient(120deg,var(--brand),#8ff0f3);
                  box-shadow:0 6px 18px rgba(92,225,230,.35); }

  /* result popup */
  .popup{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
          padding:24px; background:rgba(4,8,18,.55); backdrop-filter:blur(6px);
          opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .popup.show{ opacity:1; pointer-events:auto; }
  .card{ width:100%; max-width:360px; border-radius:26px; padding:34px 26px; text-align:center;
         background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
         backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,.5);
         transform:scale(.8); opacity:0; transition:transform .28s cubic-bezier(.2,1.3,.4,1), opacity .2s; }
  .popup.show .card{ transform:scale(1); opacity:1; }
  .badge{ width:96px; height:96px; margin:0 auto 18px; border-radius:50%; display:flex;
          align-items:center; justify-content:center; font-size:52px; font-weight:700; color:#04231a; }
  .card h1{ font-size:30px; margin:0 0 4px; font-weight:700; }
  .card p{ font-size:18px; margin:0; opacity:.9; font-weight:500; }
  .card .pcode{ margin-top:16px; font-family:ui-monospace,monospace; font-size:14px;
                letter-spacing:.5px; opacity:.75; }
  .card .psub{ margin-top:6px; font-size:14px; opacity:.7; }

  /* state colors */
  .ok .badge{ background:linear-gradient(135deg,var(--ok),#7bf0cf); box-shadow:0 0 40px rgba(55,224,176,.6); }
  .ok h1{ color:var(--ok); text-shadow:0 0 22px rgba(55,224,176,.5); }
  .bad .badge{ background:linear-gradient(135deg,var(--bad),#ff9aa4); color:#2a0708; box-shadow:0 0 40px rgba(255,107,122,.55); }
  .bad h1{ color:var(--bad); }
  .warn .badge{ background:linear-gradient(135deg,var(--warn),#ffe3a6); color:#2a1c02; }
  .warn h1{ color:var(--warn); }

  /* ===================== STAFF LOGIN GATE ===================== */
  #authGate{ position:fixed; inset:0; z-index:100; display:flex; align-items:center;
    justify-content:center; padding:24px;
    background:radial-gradient(1200px 800px at 50% -10%, #12203a 0%, transparent 60%),
      linear-gradient(160deg,#070b16 0%,#0b1122 55%,#080d1a 100%); }
  #authGate[hidden]{ display:none; }
  #authCard{ width:100%; max-width:330px; border-radius:24px; padding:30px 26px 26px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #authCard h1{ margin:0; font-size:21px; font-weight:700; }
  #authCard .sub{ margin:4px 0 22px; font-size:13.5px; opacity:.6; font-weight:500; }
  #authCard label{ display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    opacity:.55; margin:0 0 6px; }
  #authCard input{ width:100%; padding:12px 14px; margin:0 0 16px; border-radius:12px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
    color:#fff; font-size:15px; font-family:"Fredoka",sans-serif; outline:none;
    transition:border-color .18s, box-shadow .18s; }
  #authCard input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(92,225,230,.18); }
  #authBtn{ width:100%; padding:13px; margin-top:4px; border:none; border-radius:12px;
    cursor:pointer; font-family:"Fredoka",sans-serif; font-weight:600; font-size:15px;
    color:#062225; background:linear-gradient(120deg,var(--brand),#8ff0f3);
    box-shadow:0 6px 18px rgba(92,225,230,.35); }
  #authBtn[disabled]{ opacity:.55; }
  #authErr{ min-height:18px; margin:13px 0 0; font-size:13px; text-align:center;
    color:var(--bad); font-weight:500; }
  #signOutBtn{ position:fixed; top:10px; right:10px; z-index:9; padding:7px 13px;
    border-radius:999px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06); color:var(--ink); opacity:.5;
    font-family:"Fredoka",sans-serif; font-size:12px; cursor:pointer; }
  #signOutBtn:hover{ opacity:1; }
  #netBar{ position:fixed; left:0; right:0; top:0; z-index:11; padding:7px;
    text-align:center; font-size:13px; font-weight:600; color:#2a1c02;
    background:var(--warn); display:none; }
  #netBar.show{ display:block; }
</style>
<!-- Scanner library. See note in the handover doc about self-hosting this
     file in the repo so show night does not depend on unpkg being reachable. -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
<div id="netBar">Offline \u2014 scans are paused until the connection returns</div>

<div id="authGate">
  <div id="authCard">
    <h1>Staff sign in</h1>
    <p class="sub">Annual Jam \u00b7 Check-in</p>
    <label for="authEmail">Email</label>
    <input id="authEmail" type="email" autocomplete="username" spellcheck="false" placeholder="you@imap.com">
    <label for="authPass">Password</label>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022">
    <button id="authBtn" type="button">Sign in</button>
    <p id="authErr" role="alert"></p>
  </div>
</div>
<button id="signOutBtn" type="button" hidden>Sign out</button>

<div class="orbs">
  <div class="orb c o1"></div><div class="orb p o2"></div><div class="orb w o3"></div>
  <div class="orb c o4"></div><div class="orb p o5"></div><div class="orb w o6"></div>
</div>

<div class="app">
  <img class="logo" src="logo_orb.png" alt="iMAP Annual Jam" />
  <div class="counter glass">Admitted <b id="admitted">–</b> / <span id="ticketTotal">337</span></div>

  <div class="scanner glass">
    <div id="reader"></div>
  </div>
  <div class="scanhint">Point the camera at a ticket QR</div>

  <div class="manual glass">
    <input id="manualCode" placeholder="Or type code e.g. IMAP-JAM-2026-AB12CD" autocomplete="off" />
    <button id="manualBtn">Check code</button>
  </div>
</div>

<!-- result popup -->
<div id="popup" class="popup" onclick="hidePopup()">
  <div class="card" id="card">
    <div class="badge" id="badge">✓</div>
    <h1 id="ptitle">Welcome!</h1>
    <p id="pmsg">Check-in Successful</p>
    <div class="pcode" id="pcode"></div>
    <div class="psub" id="psub"></div>
  </div>
</div>

<script>
/* =========================================================================
   iMAP Annual Jam - check-in
   Requires a signed-in staff account. Nothing is read from or written to
   the database until firebase.auth() reports a user.
   ========================================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAJxNdydfsVE1Q-NH2anVFXB-fqVlrpFlo",
  authDomain: "imap-attendance.firebaseapp.com",
  databaseURL: "https://imap-attendance-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "imap-attendance",
  storageBucket: "imap-attendance.firebasestorage.app",
  messagingSenderId: "303801381171",
  appId: "1:303801381171:web:0a5cacfc8d724584d7ce46",
  measurementId: "G-NNKW0SEVL8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = (id) => document.getElementById(id);
let busy = false, hideTimer = null, busyGuard = null;
let scanner = null, started = false;

/* ---------------------------------- AUTH ---------------------------------- */
function authError(code){
  switch(code){
    case 'auth/invalid-email':          return 'That email address is not valid.';
    case 'auth/user-disabled':          return 'This account has been disabled.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential':     return 'Wrong email or password.';
    case 'auth/too-many-requests':      return 'Too many attempts. Wait a minute.';
    case 'auth/network-request-failed': return 'No connection. Check the wifi.';
    default:                            return 'Could not sign in. Try again.';
  }
}

async function attemptLogin(){
  const e = ($("authEmail").value || "").trim();
  const p = $("authPass").value || "";
  $("authErr").textContent = "";
  if(!e || !p){ $("authErr").textContent = "Enter your email and password."; return; }
  $("authBtn").disabled = true; $("authBtn").textContent = "Signing in\u2026";
  try{
    await firebase.auth().signInWithEmailAndPassword(e, p);
  }catch(ex){
    $("authErr").textContent = authError(ex && ex.code);
    $("authPass").value = ""; $("authPass").focus();
  }finally{
    $("authBtn").disabled = false; $("authBtn").textContent = "Sign in";
  }
}

$("authBtn").addEventListener("click", attemptLogin);
["authEmail","authPass"].forEach(id => $(id).addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ ev.preventDefault(); attemptLogin(); }
}));
$("signOutBtn").addEventListener("click", () => {
  firebase.auth().signOut().then(() => location.reload());
});

firebase.auth().onAuthStateChanged(user => {
  if(user){
    $("authGate").hidden = true;
    $("signOutBtn").hidden = false;
    if(!started){ started = true; startApp(); }
  }else{
    if(started){ location.reload(); return; }
    $("authGate").hidden = false;
    $("authPass").value = "";
  }
});

/* ------------------------------ CONNECTION -------------------------------- */
/* Venue wifi drops. Show it plainly rather than letting scans fail silently. */
let online = true;
function watchConnection(){
  db.ref(".info/connected").on("value", snap => {
    online = snap.val() === true;
    $("netBar").classList.toggle("show", !online);
  });
}

/* -------------------------------- COUNTER ---------------------------------
   The original build kept a live .on("value") listener on the whole Tickets
   node, so every device downloaded all 337 records again after every single
   scan. One full read on load, then per-record updates only.
--------------------------------------------------------------------------- */
let admitted = 0, totalTickets = 337;

function renderCount(){
  $("admitted").textContent = admitted;
  const t = $("ticketTotal");
  if(t) t.textContent = totalTickets;
}

function startCounter(){
  db.ref("Tickets").once("value").then(snap => {
    let used = 0, total = 0;
    snap.forEach(c => { total++; const v = c.val(); if(v && v.used) used++; });
    admitted = used;
    if(total > 0) totalTickets = total;
    renderCount();

    db.ref("Tickets").on("child_changed", c => {
      const v = c.val();
      if(v && v.used){ admitted++; renderCount(); }
    });
  }).catch(err => {
    console.error("Could not load tickets", err);
    const denied = String(err && (err.code || err.message)).toUpperCase().indexOf("PERMISSION") !== -1;
    showPopup("warn", denied ? "No access" : "Cannot reach list",
      denied ? "This account is not on the staff list" : "Check the connection", "");
  });
}

/* --------------------------------- POPUP ---------------------------------- */
function showPopup(state, title, msg, code, sub){
  clearTimeout(hideTimer);
  $("card").className = "card " + state;
  $("badge").textContent = state === "ok" ? "\u2713" : (state === "warn" ? "!" : "\u2715");
  $("ptitle").textContent = title;
  $("pmsg").textContent = msg;
  $("pcode").textContent = code || "";
  $("psub").textContent = sub || "";
  $("popup").classList.add("show");
  hideTimer = setTimeout(hidePopup, state === "ok" ? 1900 : 2600);
}
function hidePopup(){
  clearTimeout(busyGuard);
  $("popup").classList.remove("show");
  busy = false;
}

/* -------------------------------- CHECK-IN -------------------------------- */
function checkCode(raw){
  if (busy) return;
  const code = (raw || "").trim().toUpperCase();
  if (!code) return;
  busy = true;

  /* If the transaction callback never fires (dropped wifi mid-scan) the old
     build left busy=true and the scanner went dead for the rest of the night. */
  clearTimeout(busyGuard);
  busyGuard = setTimeout(() => {
    if(busy) showPopup("warn", "No response", "Check the connection, then scan again", code);
  }, 8000);

  const ref = db.ref("Tickets/" + code.replace(/[.#$/\[\]]/g, ""));
  ref.transaction((cur) => {
    if (cur === null) return;        // unknown code -> abort
    if (cur.used) return;            // already used -> abort
    cur.used = true; cur.usedAt = Date.now();
    cur.usedBy = (firebase.auth().currentUser || {}).email || null;
    return cur;
  }, (err, committed, snap) => {
    clearTimeout(busyGuard);
    if (err){
      const denied = String(err.code || err.message).toUpperCase().indexOf("PERMISSION") !== -1;
      showPopup("warn", denied ? "No access" : "Try again",
        denied ? "This account cannot check tickets in" : "Network hiccup", code);
    }
    else if (!snap.exists()){ showPopup("bad", "Invalid ticket", "Not on the guest list", code); }
    else if (!committed){
      const t = snap.val().usedAt ? new Date(snap.val().usedAt).toLocaleTimeString() : "";
      showPopup("bad", "Already checked in", "This ticket was used", code, t ? "First scanned " + t : "");
    }
    else {
      const cat = snap.val().cat;
      const label = cat === "student" ? "Student pass" : (cat === "sellable" ? "Sold ticket" : "");
      showPopup("ok", "Welcome!", "Check-in Successful", code, label);
    }
  });
}

$("manualBtn").onclick = () => { checkCode($("manualCode").value); $("manualCode").value = ""; };
$("manualCode").addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ ev.preventDefault(); $("manualBtn").onclick(); }
});

/* -------------------------------- SCANNER --------------------------------- */
function startScanner(){
  scanner = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then((cams) => {
    const back = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
    scanner.start(
      back ? back.id : { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      (decoded) => checkCode(decoded),
      () => {}
    );
  }).catch(() => {
    document.querySelector(".scanhint").textContent = "Camera unavailable \u2014 use the code box below";
  });
}

/* Nothing above touches the database until this runs. */
function startApp(){
  watchConnection();
  startCounter();
  startScanner();
}
</script>
</body>
</html>
